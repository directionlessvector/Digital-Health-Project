name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install PyQt6 psutil ruff mypy pytest

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Type-check with mypy
        run: python -m mypy screensense --ignore-missing-imports --disable-error-code=import-untyped

      - name: Run tests
        run: python -m pytest
